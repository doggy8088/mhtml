[package]
name = "mhtml"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Convert Markdown to a beautiful, self-contained HTML page — preview in your browser, switch light/dark themes, and bring your own CSS."
license = "MIT"
authors = ["Will 保哥"]
repository = "https://github.com/doggy8088/mhtml"
readme = "README.md"
keywords = ["markdown", "html", "cli", "preview"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "mhtml"
path = "src/lib.rs"

[[bin]]
name = "mhtml"
path = "src/main.rs"
# The command needs the CLI, the config file and the browser; the library does
# not (build it with `default-features = false` to leave those out).
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:dirs",
    "dep:libc",
    "dep:open",
    "dep:serde",
    "dep:toml",
]

[dependencies]
ammonia = "4.2.3"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"], optional = true }
dirs = { version = "7.0.0", optional = true }
latex2mathml = "0.2.3"
open = { version = "5.4.4", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy", "html"] }
toml = { version = "1.1.8", optional = true }
two-face = "0.5.2"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
